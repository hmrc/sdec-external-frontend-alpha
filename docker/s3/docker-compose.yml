version: "3.9"

services:

  minio:
    image: minio/minio:latest
    container_name: minio

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123

    command: server /data --console-address ":9001"

    volumes:
      - minio-data:/data

  createbucket:
    image: minio/mc:latest

    depends_on:
      - minio

    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 minio minio123); do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      /usr/bin/mc mb local/uploads --ignore-existing;
      /usr/bin/mc anonymous set private local/uploads;
      exit 0;
      "

volumes:
  minio-data: